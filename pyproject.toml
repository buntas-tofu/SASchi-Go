[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saschi-go"
version = "0.2.0"
description = "SAS migration plans, numeric execution, and verification receipts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
verify = ["numpy>=2,<3", "pandas>=3,<4", "scipy>=1.15,<2", "duckdb>=1,<2", "jsonschema>=4,<5"]

[project.scripts]
saschi = "saschi.cli:main"

[tool.setuptools]
packages = ["saschi"]
py-modules = ["sas_semantics"]
