name: Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    name: Fixture gates, portable plans, and synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buntas-tofu/SASchi-Roku
          ref: 00b8b8879292309ef67d8351a05d333a0d66b9ae
          path: .verification-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned gate dependencies
        run: |
          pip install -r requirements-verify.lock
          pip install --no-deps -e .
      - name: Install base R and the C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core g++
      - name: Check the environment and run every gate
        env:
          SASCHI_ROKU_CORPUS: ${{ github.workspace }}/.verification-corpus/corpus
        run: |
          saschi doctor
          python verify_all.py
      - name: Keep receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-receipt
          path: telemetry/verify/receipt_*.json
          if-no-files-found: warn
