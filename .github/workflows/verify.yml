name: Verification
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  verify:
    name: Fixture gates, portable plans, and synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buntas-tofu/SASchi-Roku
          ref: 00b8b8879292309ef67d8351a05d333a0d66b9ae
          path: .verification-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned gate dependencies
        run: |
          pip install -r requirements-verify.lock
          pip install --no-deps -e .
      - name: Install base R and the C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core g++ python3-tk
      - name: Check the environment and run every gate
        env:
          SASCHI_ROKU_CORPUS: ${{ github.workspace }}/.verification-corpus/corpus
        run: |
          python tools/prepare_vendor_sources.py
          python tools/prepare_postal_reference.py
          saschi doctor
          python verify_all.py
      - name: Check monthly ledger against independent R (1k)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p telemetry/workloads
          python tools/run_workloads.py --output telemetry/workloads/ci-ledger --sizes 1000 2>&1 | tee telemetry/workloads/ci-ledger.log
      - name: Check grouped text against independent R (1k)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p telemetry/workloads
          python tools/run_text_workloads.py --output telemetry/workloads/ci-text --sizes 1000 2>&1 | tee telemetry/workloads/ci-text.log
      - name: Keep receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-receipt
          path: telemetry/verify/receipt_*.json
          if-no-files-found: warn
      - name: Keep workload receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-diagnostics
          path: telemetry/workloads/
          if-no-files-found: warn
  package-smoke:
    name: Desktop package builds, installs, and starts headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev python3-tk xvfb xauth
          python -m pip install --upgrade setuptools wheel
      - name: Build the Debian package
        run: python tools/build_desktop_deb.py --output output/saschi-desktop.deb
      - name: Assert the control metadata and payload
        shell: bash
        run: |
          set -euo pipefail
          deb=output/saschi-desktop.deb
          test -s "$deb"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          control=$(dpkg-deb -I "$deb")
          grep -q '^ Package: saschi-desktop$' <<<"$control"
          grep -q "^ Version: ${version}+desktop2$" <<<"$control"
          grep -q '^ Architecture: all$' <<<"$control"
          grep -q 'Depends:.*python3-tk' <<<"$control"
          grep -q 'Depends:.*python3-pandas' <<<"$control"
          grep -q 'Depends:.*xdg-utils' <<<"$control"
          contents=$(dpkg-deb --fsys-tarfile "$deb" | tar -t)
          for path in \
              ./usr/bin/saschi-desktop \
              ./usr/share/applications/saschi-desktop.desktop \
              ./usr/share/doc/saschi-desktop/copyright \
              ./usr/lib/saschi-desktop/saschi/data/sasconversionrulebook.json
          do
            grep -qx -- "$path" <<<"$contents" || { echo "missing payload path: $path"; exit 1; }
          done
          echo "metadata and payload verified for version ${version}+desktop2"
      - name: Install and start the entry point headless
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./output/saschi-desktop.deb
          set +e
          message=$(env -u DISPLAY -u WAYLAND_DISPLAY saschi-desktop 2>&1)
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'Desktop display unavailable' <<<"$message"
          echo "headless entry point exited ${code} with the documented display message"
      - name: Check installed native import and desktop workflow
        env:
          PYTHONPATH: /usr/lib/saschi-desktop
        run: |
          cd /tmp
          /usr/bin/python3 -c "import pandas; import saschi; assert saschi.__file__.startswith('/usr/lib/saschi-desktop/')"
          /usr/bin/python3 -m unittest \
            saschi.test_data_files.DataFilesTests.test_sas7bdat_real_reader_preserves_both_byte_orders_tags_dates_and_metadata \
            saschi.test_data_files.DataFilesTests.test_sas7bdat_empty_table_and_explicit_refusals \
            saschi.test_data_files.DataFilesTests.test_sas7bdat_long_character_bytes_survive_rle_and_nul_padding \
            saschi.test_data_files.DataFilesTests.test_native_unadorned_numeric_schema_matches_new_runtime_variables \
            saschi.test_data_files.DataFilesTests.test_xport_real_reader_retains_raw_missing_tags_and_labels
          xvfb-run -a /usr/bin/python3 "$GITHUB_WORKSPACE/tools/smoke_desktop_ui.py"
      - name: Keep the reviewed desktop package
        uses: actions/upload-artifact@v4
        with:
          name: saschi-desktop-debian
          path: output/saschi-desktop.deb
