  # ============ MACRO / AUTOMATION ============

  - rule_id: MC-001
    sas_pattern: "%LET / &var global macro variables"
    scope: macro
    python_target: {package: stdlib, pattern: "TOML config via tomllib + typed access; CLI args via argparse; secrets via env vars"}
    r_target: {package: config, pattern: "config::get() with per-environment YAML; CLI via optparse; secrets via Sys.getenv"}
    forbidden_patterns: ["global mutable variables as config", "secrets in files"]
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
    sources: [S-10]

  - rule_id: MC-002
    sas_pattern: "%MACRO with parameters (value substitution only)"
    scope: macro
    python_target: {package: python, pattern: "ordinary function returning a value; iterate over a parameter table"}
    r_target: {package: purrr, pattern: "function + pmap() over a parameter tibble; declarative: targets tar_map"}
    equivalence_class: PATTERN-REPLACEMENT
    detection: "macro substitutes only VALUES (dataset names, variables, cutoffs) -> mechanical; substitutes CODE FRAGMENTS or %IF changes program structure -> MC-004"
    confidence: high
    sources: [S-10]

  - rule_id: MC-003
    sas_pattern: "%DO loops generating code / suffix-named datasets (out_&i)"
    scope: macro
    python_target: {package: python, pattern: "build iteration table; loop; collect into one long frame with parameter COLUMNS, never name suffixes"}
    r_target: {package: purrr, pattern: "pmap over rows; bind_rows with .id"}
    forbidden_patterns: ["generating code strings", "encoding parameters in object names"]
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
    sources: [S-10]

  - rule_id: MC-004
    sas_pattern: "CALL EXECUTE / %sysfunc code generation / dynamic code construction"
    scope: macro
    equivalence_class: NO-DIRECT-EQUIVALENT
    action: human-review
    rationale: "Highest-risk construct for automated conversion. Usual true pattern: control table driving dict/named-list function dispatch (do.call). Dynamic SQL: parameterized queries / glue::glue_sql only."
    forbidden_patterns: ["eval()", "exec()", "eval(parse(text=))"]
    confidence: high
    sources: [S-10]

  - rule_id: MC-005
    sas_pattern: "%INCLUDE"
    scope: macro
    python_target: {package: python, pattern: "definitions -> importable module/package; steps -> pipeline nodes"}
    r_target: {package: box/targets, pattern: "definitions -> internal package or box::use module; steps -> targets"}
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
    sources: [S-10]

  - rule_id: MC-006
    sas_pattern: "SYSTASK / X commands / batch job flows"
    scope: macro
    python_target: {package: snakemake-or-prefect, pattern: "serverless pipeline (Snakemake / Prefect local) driven by enterprise scheduler; shell-outs -> subprocess.run(check=True) or native pathlib/shutil"}
    r_target: {package: targets, pattern: "_targets.R dependency graph; Rscript entry point under enterprise scheduler; processx/fs for OS work"}
    required_settings: ["no new always-on services without ATO justification (Airflow only where a hardened instance exists)"]
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
    sources: [S-10]

  - rule_id: MC-007
    sas_pattern: "ODS OUTPUT / ODS EXCEL/PDF/RTF reporting"
    scope: macro
    python_target: {package: statsmodels+great-tables+quarto, pattern: "results objects accessed programmatically (never text-scraped); tables via great-tables/openpyxl; documents via parameterized Quarto"}
    r_target: {package: broom+gt+quarto, pattern: "tidy()/glance()/augment(); gt/gtsummary; officer/flextable for Word; parameterized Quarto render for ODS PDF/RTF batch loops"}
    forbidden_patterns: ["parsing printed model summaries"]
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
    sources: [S-10]

  - rule_id: MC-008
    sas_pattern: "Log NOTES QC / SYSERR / SYSCC return codes"
