    equivalence_class: PATTERN-REPLACEMENT (strictly stronger than log-grepping)
    confidence: high
    sources: [S-10]

  - rule_id: MC-009
    sas_pattern: "Autoexec / PROC DATASETS housekeeping / format catalogs"
