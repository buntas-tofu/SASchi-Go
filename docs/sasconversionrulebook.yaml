    python_target: {package: python, pattern: "explicit settings module; tempfile; Parquet directories as the library successor; versioned data dictionary for labels/formats"}
    r_target: {package: renv, pattern: ".Rprofile limited to renv activation; withr::local_tempfile; same Parquet/dictionary pattern"}
    equivalence_class: PATTERN-REPLACEMENT
    confidence: high
